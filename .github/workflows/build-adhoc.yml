# capyroom（番茄时钟移动端）iOS 构建。
#
# 两跑，故意把"编译问题"和"签名问题"拆开——一次只解一个变量：
#   sign=false：--no-sign --archive-only，只验能不能编出 .app（已验证通过）
#   sign=true ：签名出 IPA + OTA 上架到 /var/www/capyroom/_t/，手机开网页装
#
# 🔴 签名这半截**只能走 `tauri ios build`，不能直调 xcodebuild**。
#    我一开始照搬戳了么那套直调 xcodebuild，理由是"Tauri 工程里的 Build Rust Code
#    阶段会自己编 Rust，直调不缺任何东西" —— **这个判断是错的，实测推翻了**：
#    那个阶段跑的是 `tauri ios xcode-script`，它要读一个由父进程 `tauri ios build`
#    建的 IPC 地址文件（/var/folders/.../<identifier>-server-addr），
#    直调没有父进程 → 脚本 panic "failed to read missing addr file" → exit 65。
#    所以签名参数只能靠 `-- <ARGS>` 透传给 tauri 内部的 xcodebuild。
# 🔴 导出方式**两套名字别混**：Tauri CLI 的 flag 叫 `release-testing`，
#    而 ExportOptions.plist 里的 method 仍然叫 `ad-hoc`。
# 🔴 构建配置是**小写的 release**（探测跑实测：tauri 生成的工程用 debug/release，
#    不是常见的 Debug/Release）。
# 🔴 公开仓两条红线：日志全网可见，任何步骤不许 echo secret 内容；
#    绝不能加 pull_request_target 触发。
name: build-adhoc

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '签名并出 IPA + 上架 OTA（false = 只跑不签名的编译冒烟）'
        type: boolean
        default: false

env:
  # 内测包标记（9-2）：Rust 用 option_env! 编进二进制 → 调汤里露出「内测：全部解锁」。商店包的 workflow 不设这个。
  CAPY_INTERNAL: "1"
  XCPROJ: src-tauri/gen/apple/tomato.xcodeproj
  SCHEME: tomato_iOS
  BUNDLE_ID: com.tybbtech.capyroom
  OTA_BASE: https://www.tybbtech.com/capyroom/_t

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build 号用 git 提交数，浅克隆会恒等于 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'npm ci'
        run: npm ci

      - name: 'tauri ios init'
        run: npx tauri ios init --ci

      # 🔴 tauri ios init 生成的 Assets.xcassets 用的是模板默认图标，**不读 src-tauri/icons/ios**
      #    （9-2 实证：拆 IPA 解 CgBI 看到的还是 Tauri 蓝黄图标）→ 这里显式覆盖，文件名与模板一致。
      - name: '装图标（覆盖模板默认图标）'
        run: |
          DEST=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          ls "$DEST" | head -3
          cp src-tauri/icons/ios/*.png "$DEST"/
          ls -la "$DEST"/AppIcon-60x60@2x.png

      # 原生登录（9-3 账号线，tauri-plugin-social-auth）：Google SDK 要在 Info.plist 里读两个 client id，
      # 且要把 iOS client id 反转成 URL scheme 注册（登录完从浏览器跳回 App 靠它）。
      # 🔴 值全部来自 Secrets，没配就跳过（Apple 登录不依赖这两项；Google 键点了会失败但不崩）。
      # 🔴 Sign in with Apple 的 entitlement 不在这里加：签名步骤的 entitlements 从 Profile 里取，
      #    开发者后台给 App ID 开了 Sign in with Apple 能力后，asc_profile.py 建出来的 Profile 自带。
      - name: '注入 Google 登录配置（Info.plist）'
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          PL=src-tauri/gen/apple/Info.plist
          [ -f "$PL" ] || PL=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          echo "Info.plist = $PL"
          if [ -z "$GOOGLE_IOS_CLIENT_ID" ]; then echo "没配 GOOGLE_IOS_CLIENT_ID，跳过"; exit 0; fi
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :GOOGLE_IOS_CLIENT_ID string $GOOGLE_IOS_CLIENT_ID" "$PL" 2>/dev/null || $PB -c "Set :GOOGLE_IOS_CLIENT_ID $GOOGLE_IOS_CLIENT_ID" "$PL"
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            $PB -c "Add :GOOGLE_SERVER_CLIENT_ID string $GOOGLE_SERVER_CLIENT_ID" "$PL" 2>/dev/null || $PB -c "Set :GOOGLE_SERVER_CLIENT_ID $GOOGLE_SERVER_CLIENT_ID" "$PL"
          fi
          # 反转 client id：xxx.apps.googleusercontent.com → com.googleusercontent.apps.xxx
          REV=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--){printf "%s%s",$i,(i>1?".":"")}}')
          $PB -c "Add :CFBundleURLTypes array" "$PL" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PL"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" "$PL"
          echo "URL scheme 已注册（反转 client id，值不打印）"
          $PB -c "Print :CFBundleURLTypes" "$PL" | grep -c googleusercontent || true

      # 🔴 只支持 iPhone（9-4 提审卡点：默认 "1,2" 支持 iPad → ASC 强制要 iPad 截图）。与 build-appstore.yml 同一步，改要两边一起。
      - name: '只支持 iPhone（TARGETED_DEVICE_FAMILY=1）'
        run: |
          perl -0pi -e 's/^(\s*)ENABLE_BITCODE:/$1TARGETED_DEVICE_FAMILY: "1"\n$1ENABLE_BITCODE:/m' src-tauri/gen/apple/project.yml
          grep -n "TARGETED_DEVICE_FAMILY" src-tauri/gen/apple/project.yml || { echo "❌ 没插进去"; exit 1; }

      # 探测跑只看了目录结构没看内容，所以"tauri.ios.conf.json 有没有被合并"
      # 是靠这一步实证的（PRODUCT_BUNDLE_IDENTIFIER / DEVELOPMENT_TEAM 三项）。
      - name: '确认 iOS 专属配置合并进去了'
        continue-on-error: true
        run: |
          echo "===== 期望 identifier=${BUNDLE_ID}，DEVELOPMENT_TEAM=8J6A847P66，deploymentTarget iOS 15.0 ====="
          # 🔴 最低版本必须 ≥15（tauri.ios.conf.json minimumSystemVersion）：内购桥的 Swift 用 async/await，
          #    目标写 13 时 Xcode 会把兼容用的 libswift_Concurrency.dylib 塞进 Frameworks，它找 @rpath/libswiftCore.dylib
          #    而这个工程的 rpath 没有 /usr/lib/swift → 启动即 dyld 中止（9-4 build 51 闪退，崩溃日志 "Library missing"）
          grep -E "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|deploymentTarget|iOS:" src-tauri/gen/apple/project.yml
          xcodebuild -list -project "$XCPROJ"

      # ═══════════ sign=false：只验编译 ═══════════
      - name: '编译冒烟（不签名）'
        if: ${{ !inputs.sign }}
        run: npx tauri ios build --ci --no-sign --archive-only --verbose

      - name: '确认打进包的是移动端前端'
        if: ${{ !inputs.sign }}
        continue-on-error: true
        run: |
          APP=$(find src-tauri/gen/apple/build -maxdepth 5 -name "*.app" -type d | head -1)
          BIN="$APP/$(basename "$APP" .app)"
          echo "app bundle = $APP"
          echo "binary     = $BIN  ($(wc -c < "$BIN") 字节)"
          # 🔴 判据用**文件名**不用页面内容：Tauri 的 generate_context! 把
          #    frontendDist 整个嵌进二进制并压缩了，grep 页面文字必然一无所获。
          #    而资源的路径键是明文存的。
          echo "----- 移动端独有文件（应该命中）-----"
          strings "$BIN" | grep -c "_mobile_marker_capyroom" || echo "0"
          echo "----- 桌面端独有文件（应该都是 0）-----"
          for f in pet.html companion.js rest.html viz.js; do
            echo "  $f : $(strings "$BIN" | grep -c "$f")"
          done

      # ═══════════ sign=true：签名 + OTA ═══════════
      - name: '导入签名证书'
        if: ${{ inputs.sign }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          KCPW=$(uuidgen)
          echo "KC=$KC" >> $GITHUB_ENV
          printenv APPLE_CERTIFICATE_BASE64 | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 3600 $KC
          security unlock-keychain -p "$KCPW" $KC
          security import $RUNNER_TEMP/dist.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KC
          # 🔴 这一行是 CI 签名最经典的坑：不设 partition list，codesign 取私钥时
          #    会弹 UI 授权框，在无人值守的 runner 上就是挂起直到超时。
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" $KC
          security list-keychain -d user -s $KC login.keychain
          security default-keychain -s $KC
          security find-identity -v -p codesigning $KC

      - name: '放置 App Store Connect 密钥'
        if: ${{ inputs.sign }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printenv ASC_API_KEY_BASE64 | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "密钥 $(wc -c < ~/private_keys/AuthKey_${ASC_KEY_ID}.p8) 字节"

      # 🔴 签名不走 Tauri：`tauri ios build` **不会把 `-- <ARGS>` 转给 xcodebuild**
      #    （8-28 实测：透传版和不透传版报的错一模一样，都是
      #     "No Accounts" + "No profiles for com.tybbtech.capyroom"），
      #    所以 -allowProvisioningUpdates 进不去、Xcode 自动创建 Profile 走不通。
      #    也不能直调 xcodebuild：工程里的 "Build Rust Code" 阶段跑的是
      #    `tauri ios xcode-script`，它要读父进程 `tauri ios build` 建的 IPC 地址文件，
      #    直调会 panic "failed to read missing addr file"。
      #    → 于是拆开：**Tauri 只负责编译（--no-sign，已验证可跑），
      #      Profile 我们用 ASC API 自己建，签名和打包我们自己做**。
      #      每一步都是确定的，没有"参数转不转"这种赌博。
      - name: '编译（不签名）'
        if: ${{ inputs.sign }}
        run: npx tauri ios build --ci -v --no-sign --archive-only

      - name: '准备 python 环境'
        if: ${{ inputs.sign }}
        run: |
          # macOS runner 的 Homebrew Python 受 PEP 668 保护，直接 pip install 会被拒
          python3 -m venv $RUNNER_TEMP/venv
          $RUNNER_TEMP/venv/bin/python -m pip install --quiet paramiko pyjwt cryptography

      - name: '用 ASC API 建 Ad-Hoc Profile'
        if: ${{ inputs.sign }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          $RUNNER_TEMP/venv/bin/python ci/asc_profile.py "$BUNDLE_ID" $RUNNER_TEMP/capyroom.mobileprovision

      - name: '签名并打成 IPA'
        if: ${{ inputs.sign }}
        run: |
          set -e
          APP=$(find src-tauri/gen/apple/build -path "*/Products/Applications/*.app" -maxdepth 6 -type d | head -1)
          [ -n "$APP" ] || { echo "❌ 没找到 .app"; find src-tauri/gen/apple -name "*.app" -o -name "*.xcarchive" | head; exit 1; }
          echo "app = $APP"

          # 只支持 iPhone：Info.plist 的 UIDeviceFamily 改成 [1]（与 build-appstore.yml 同一步；project.yml 那行实测压不住）
          PB=/usr/libexec/PlistBuddy; PL="$APP/Info.plist"
          $PB -c "Delete :UIDeviceFamily" "$PL" 2>/dev/null || true
          $PB -c "Add :UIDeviceFamily array" "$PL"; $PB -c "Add :UIDeviceFamily:0 integer 1" "$PL"
          $PB -c "Print :UIDeviceFamily" "$PL"

          PROF=$RUNNER_TEMP/capyroom.mobileprovision
          cp "$PROF" "$APP/embedded.mobileprovision"

          # entitlements 从 Profile 里取，别自己编 —— 编错了装上去也跑不起来
          security cms -D -i "$PROF" > $RUNNER_TEMP/prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/prof.plist > $RUNNER_TEMP/ent.plist
          echo "----- entitlements -----"; cat $RUNNER_TEMP/ent.plist

          # 指纹取我们导入的那张（账号里有两张分发证书，钥匙串里只有这一张）
          IDENT=$(security find-identity -v -p codesigning "$KC" | awk '/Apple Distribution/{print $2; exit}')
          [ -n "$IDENT" ] || { echo "❌ 钥匙串里没有分发证书"; exit 1; }
          echo "identity = $IDENT"

          # 🔴 先签内层再签壳：Frameworks 里的 dylib 必须在 .app 之前签，
          #    顺序反了外层签名会在下一步被内层改动作废。
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -name "*.dylib" -o -name "*.framework" | while read f; do
              echo "  签 $f"; codesign --force --sign "$IDENT" --timestamp=none "$f"
            done
          fi
          codesign --force --sign "$IDENT" --entitlements $RUNNER_TEMP/ent.plist --timestamp=none "$APP"

          echo "----- 验签 -----"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" | head -5

          mkdir -p $RUNNER_TEMP/pack/Payload $RUNNER_TEMP/export
          cp -R "$APP" $RUNNER_TEMP/pack/Payload/
          (cd $RUNNER_TEMP/pack && zip -qry $RUNNER_TEMP/export/capyroom.ipa Payload)
          ls -l $RUNNER_TEMP/export/capyroom.ipa

      - name: '生成 manifest.plist + install.html'
        if: ${{ inputs.sign }}
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          cat > $RUNNER_TEMP/export/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>${OTA_BASE}/capyroom.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
              <key>bundle-version</key><string>${BUILD_NUM}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>capyroom</string>
            </dict>
          </dict></array></dict></plist>
          PLIST
          cat > $RUNNER_TEMP/export/install.html <<HTML
          <!doctype html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>capyroom · 测试包</title>
          <style>body{font:16px/1.8 -apple-system,system-ui;margin:0;padding:56px 24px;
          background:#14100d;color:#cbb89a;text-align:center}
          h1{font-size:22px;margin:0 0 6px;color:#f0c9a0}p{color:#8a7a63;font-size:14px;margin:4px 0}
          a.install{display:inline-block;margin-top:28px;padding:14px 34px;background:#e8590c;
          color:#fff;text-decoration:none;border-radius:12px;font-size:17px}
          .n{margin-top:34px;font-size:12px;color:#6f6047;line-height:1.9}</style>
          <h1>capyroom</h1>
          <p>测试包 build ${BUILD_NUM}</p>
          <p style="color:#6f6047">画面全是占位色块，这一版验的是计时和通知</p>
          <p><a class="install" href="itms-services://?action=download-manifest&amp;url=${OTA_BASE}/manifest.plist">安装</a></p>
          <div class="n">用 iPhone 的 Safari 打开这一页才能装<br>
          只能装进已注册的设备<br>装完若提示「未受信任」：设置 → 通用 → VPN 与设备管理 → 信任</div>
          HTML
          ls -l $RUNNER_TEMP/export

      - name: '上架 OTA'
        if: ${{ inputs.sign }}
        env:
          OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
          OTA_SSH_PORT: ${{ secrets.OTA_SSH_PORT }}
          OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
          OTA_SSH_PASSWORD: ${{ secrets.OTA_SSH_PASSWORD }}
        run: |
          $RUNNER_TEMP/venv/bin/python ci/ota_deploy.py \
            $RUNNER_TEMP/export/capyroom.ipa \
            $RUNNER_TEMP/export/manifest.plist \
            $RUNNER_TEMP/export/install.html
          echo "装机页：${OTA_BASE}/install.html"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sign }}
        continue-on-error: true
        with:
          name: capyroom-ipa
          path: ${{ runner.temp }}/export/*
          if-no-files-found: warn
