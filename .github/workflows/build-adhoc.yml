# capyroom（番茄时钟移动端）iOS 构建。
#
# 分两跑，故意把"编译问题"和"签名问题"拆开——一次只解一个变量：
#   sign=false（第一跑）：--no-sign --archive-only，只验能不能编出 .app
#   sign=true （第二跑）：导入证书 + --export-method release-testing 出 IPA，
#                        再传服务器 _t/ 生成 install.html 装机
#
# 🔴 导出方式没有 ad-hoc 这个词（Xcode 15 之后改名）：
#    app-store-connect / release-testing / debugging，**release-testing 才是 ad-hoc**。
# 🔴 公开仓两条红线：日志全网可见，任何步骤不许 echo secret 内容；
#    绝不能加 pull_request_target 触发。
name: build-adhoc

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '签名并出 IPA（false = 只跑不签名的编译冒烟）'
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'npm ci'
        run: npm ci

      - name: 'tauri ios init'
        run: npx tauri ios init --ci

      # 探测第 7 步只看了目录结构、没看内容，所以"tauri.ios.conf.json 到底有没有
      # 被合并进去"还没实证。生成的工程叫 tomato.xcodeproj（跟 Cargo 包名一致），
      # 而 productName 写的是 capyroom —— 必须看 identifier 才能确认。
      - name: '🔴 确认 iOS 专属配置有没有合并进去'
        continue-on-error: true
        run: |
          echo "===== 期望：identifier = com.tybbtech.capyroom，DEVELOPMENT_TEAM = 8J6A847P66 ====="
          echo "----- project.yml -----"
          cat src-tauri/gen/apple/project.yml
          echo "----- Info.plist 里的 bundle id -----"
          plutil -p src-tauri/gen/apple/*_iOS/Info.plist | grep -iE "CFBundleIdentifier|CFBundleName|CFBundleShortVersion" || true
          echo "----- ExportOptions.plist -----"
          cat src-tauri/gen/apple/ExportOptions.plist || true

      # ---------- 第一跑：完全不碰签名 ----------
      - name: '编译冒烟（不签名）'
        if: ${{ !inputs.sign }}
        run: npx tauri ios build --ci --no-sign --archive-only --verbose

      # 两端前端分家的实证：iOS 包里必须是 src-mobile 那份，
      # 桌面那份（序列编辑器/桌宠窗/遮罩窗，全是给鼠标设计的）一个字都不该进来。
      - name: '🔴 确认打进包的是移动端前端'
        if: ${{ !inputs.sign }}
        continue-on-error: true
        run: |
          APP=$(find src-tauri/gen/apple/build -maxdepth 5 -name "*.app" -type d | head -1)
          BIN="$APP/$(basename "$APP" .app)"
          echo "app bundle = $APP"
          echo "binary     = $BIN  ($(wc -c < "$BIN") 字节)"
          # 🔴 判据用**文件名**不用页面内容：Tauri 的 generate_context! 会把
          #    frontendDist 整个嵌进 Rust 二进制并压缩，所以在 .app 里 grep
          #    页面文字必然一无所获（上一跑两个标记都没命中就是这个原因）。
          #    而资源的路径键是明文存的，所以拿独有的文件名当判据才成立。
          echo "----- 移动端独有文件（应该命中）-----"
          strings "$BIN" | grep -c "_mobile_marker_capyroom" || echo "0"
          echo "----- 桌面端独有文件（应该都是 0）-----"
          for f in pet.html companion.js rest.html viz.js; do
            echo "  $f : $(strings "$BIN" | grep -c "$f")"
          done
          echo "----- 兜底诊断：二进制里的 .html/.js 资源键长什么样 -----"
          strings "$BIN" | grep -oE "/?[A-Za-z0-9_.-]+\.(html|js|css)" | sort -u | head -20

      - name: '产物清单'
        if: ${{ !inputs.sign }}
        continue-on-error: true
        run: |
          echo "===== gen/apple 下新增了什么 ====="
          find src-tauri/gen/apple -maxdepth 4 -name "*.app" -o -maxdepth 4 -name "*.xcarchive" -o -maxdepth 4 -name "*.ipa" | head -20
          echo "===== build 目录 ====="
          find src-tauri/gen/apple/build -maxdepth 3 2>/dev/null | head -40 || echo "(没有 build 目录)"

      # ---------- 第二跑：签名 + 出 IPA（这一跑还没调通，先留着） ----------
      - name: '导入签名证书'
        if: ${{ inputs.sign }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          printenv APPLE_CERTIFICATE_BASE64 | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p buildpw "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p buildpw "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning "$KC"

      - name: '出 IPA（release-testing ＝ 旧称 ad-hoc）'
        if: ${{ inputs.sign }}
        env:
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printenv ASC_API_KEY_BASE64 | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          export APPLE_API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          npx tauri ios build --ci --export-method release-testing --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: capyroom-ios
          path: |
            src-tauri/gen/apple/project.yml
            src-tauri/gen/apple/ExportOptions.plist
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
