# capyroom（番茄时钟移动端）iOS 构建。
#
# 两跑，故意把"编译问题"和"签名问题"拆开——一次只解一个变量：
#   sign=false：--no-sign --archive-only，只验能不能编出 .app（已验证通过）
#   sign=true ：签名出 IPA + OTA 上架到 /var/www/capyroom/_t/，手机开网页装
#
# 🔴 签名这半截**直调 xcodebuild**，不走 `tauri ios build --export-method`：
#    直调是戳了么已经跑通的路子，`-allowProvisioningUpdates` 和三个
#    -authenticationKey* 参数怎么传都是确定的；而 tauri 的 `-- <ARGS>` 到底
#    转不转给 xcodebuild，帮助文本没写、也没人验过。Tauri 生成的 Xcode 工程里
#    有 "Build Rust Code" 预构建阶段会自己编 Rust，所以直调不缺任何东西。
# 🔴 导出方式**两套名字别混**：Tauri CLI 的 flag 叫 `release-testing`，
#    而 ExportOptions.plist 里的 method 仍然叫 `ad-hoc`。
# 🔴 构建配置是**小写的 release**（探测跑实测：tauri 生成的工程用 debug/release，
#    不是常见的 Debug/Release）。
# 🔴 公开仓两条红线：日志全网可见，任何步骤不许 echo secret 内容；
#    绝不能加 pull_request_target 触发。
name: build-adhoc

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '签名并出 IPA + 上架 OTA（false = 只跑不签名的编译冒烟）'
        type: boolean
        default: false

env:
  XCPROJ: src-tauri/gen/apple/tomato.xcodeproj
  SCHEME: tomato_iOS
  BUNDLE_ID: com.tybbtech.capyroom
  OTA_BASE: https://www.tybbtech.com/capyroom/_t

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build 号用 git 提交数，浅克隆会恒等于 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'npm ci'
        run: npm ci

      - name: 'tauri ios init'
        run: npx tauri ios init --ci

      # 探测跑只看了目录结构没看内容，所以"tauri.ios.conf.json 有没有被合并"
      # 是靠这一步实证的（PRODUCT_BUNDLE_IDENTIFIER / DEVELOPMENT_TEAM 三项）。
      - name: '确认 iOS 专属配置合并进去了'
        continue-on-error: true
        run: |
          echo "===== 期望 identifier=${BUNDLE_ID}，DEVELOPMENT_TEAM=8J6A847P66 ====="
          grep -E "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM" src-tauri/gen/apple/project.yml
          xcodebuild -list -project "$XCPROJ"

      # ═══════════ sign=false：只验编译 ═══════════
      - name: '编译冒烟（不签名）'
        if: ${{ !inputs.sign }}
        run: npx tauri ios build --ci --no-sign --archive-only --verbose

      - name: '确认打进包的是移动端前端'
        if: ${{ !inputs.sign }}
        continue-on-error: true
        run: |
          APP=$(find src-tauri/gen/apple/build -maxdepth 5 -name "*.app" -type d | head -1)
          BIN="$APP/$(basename "$APP" .app)"
          echo "app bundle = $APP"
          echo "binary     = $BIN  ($(wc -c < "$BIN") 字节)"
          # 🔴 判据用**文件名**不用页面内容：Tauri 的 generate_context! 把
          #    frontendDist 整个嵌进二进制并压缩了，grep 页面文字必然一无所获。
          #    而资源的路径键是明文存的。
          echo "----- 移动端独有文件（应该命中）-----"
          strings "$BIN" | grep -c "_mobile_marker_capyroom" || echo "0"
          echo "----- 桌面端独有文件（应该都是 0）-----"
          for f in pet.html companion.js rest.html viz.js; do
            echo "  $f : $(strings "$BIN" | grep -c "$f")"
          done

      # ═══════════ sign=true：签名 + OTA ═══════════
      - name: '导入签名证书'
        if: ${{ inputs.sign }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          KCPW=$(uuidgen)
          echo "KC=$KC" >> $GITHUB_ENV
          printenv APPLE_CERTIFICATE_BASE64 | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 3600 $KC
          security unlock-keychain -p "$KCPW" $KC
          security import $RUNNER_TEMP/dist.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KC
          # 🔴 这一行是 CI 签名最经典的坑：不设 partition list，codesign 取私钥时
          #    会弹 UI 授权框，在无人值守的 runner 上就是挂起直到超时。
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" $KC
          security list-keychain -d user -s $KC login.keychain
          security default-keychain -s $KC
          security find-identity -v -p codesigning $KC

      - name: '放置 App Store Connect 密钥'
        if: ${{ inputs.sign }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printenv ASC_API_KEY_BASE64 | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "密钥 $(wc -c < ~/private_keys/AuthKey_${ASC_KEY_ID}.p8) 字节"

      - name: 'archive（自动创建 Provisioning Profile）'
        if: ${{ inputs.sign }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -archivePath $RUNNER_TEMP/capyroom.xcarchive \
            -sdk iphoneos \
            -configuration release \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: '导出 IPA'
        if: ${{ inputs.sign }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/capyroom.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID $ASC_KEY_ID \
            -authenticationKeyIssuerID $ASC_ISSUER_ID
          ls -l $RUNNER_TEMP/export

      - name: '生成 manifest.plist + install.html'
        if: ${{ inputs.sign }}
        run: |
          IPA=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          cp "$IPA" $RUNNER_TEMP/export/capyroom.ipa
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          cat > $RUNNER_TEMP/export/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>${OTA_BASE}/capyroom.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
              <key>bundle-version</key><string>${BUILD_NUM}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>capyroom</string>
            </dict>
          </dict></array></dict></plist>
          PLIST
          cat > $RUNNER_TEMP/export/install.html <<HTML
          <!doctype html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>capyroom · 测试包</title>
          <style>body{font:16px/1.8 -apple-system,system-ui;margin:0;padding:56px 24px;
          background:#14100d;color:#cbb89a;text-align:center}
          h1{font-size:22px;margin:0 0 6px;color:#f0c9a0}p{color:#8a7a63;font-size:14px;margin:4px 0}
          a.install{display:inline-block;margin-top:28px;padding:14px 34px;background:#e8590c;
          color:#fff;text-decoration:none;border-radius:12px;font-size:17px}
          .n{margin-top:34px;font-size:12px;color:#6f6047;line-height:1.9}</style>
          <h1>capyroom</h1>
          <p>测试包 build ${BUILD_NUM}</p>
          <p style="color:#6f6047">画面全是占位色块，这一版验的是计时和通知</p>
          <p><a class="install" href="itms-services://?action=download-manifest&amp;url=${OTA_BASE}/manifest.plist">安装</a></p>
          <div class="n">用 iPhone 的 Safari 打开这一页才能装<br>
          只能装进已注册的设备<br>装完若提示「未受信任」：设置 → 通用 → VPN 与设备管理 → 信任</div>
          HTML
          ls -l $RUNNER_TEMP/export

      - name: '上架 OTA'
        if: ${{ inputs.sign }}
        env:
          OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
          OTA_SSH_PORT: ${{ secrets.OTA_SSH_PORT }}
          OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
          OTA_SSH_PASSWORD: ${{ secrets.OTA_SSH_PASSWORD }}
        run: |
          # 🔴 macOS runner 的 Homebrew Python 受 PEP 668 保护，直接 pip install 会被拒
          #    （externally-managed-environment）。走 venv，别用 --break-system-packages 硬闯。
          python3 -m venv $RUNNER_TEMP/venv
          $RUNNER_TEMP/venv/bin/python -m pip install --quiet paramiko
          $RUNNER_TEMP/venv/bin/python ci/ota_deploy.py \
            $RUNNER_TEMP/export/capyroom.ipa \
            $RUNNER_TEMP/export/manifest.plist \
            $RUNNER_TEMP/export/install.html
          echo "装机页：${OTA_BASE}/install.html"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sign }}
        continue-on-error: true
        with:
          name: capyroom-ipa
          path: ${{ runner.temp }}/export/*
          if-no-files-found: warn
