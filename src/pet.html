<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>番茄水豚</title>
<style>
  *{ box-sizing:border-box; -webkit-user-select:none; user-select:none }
  html,body{ height:100%; margin:0; background:transparent; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif }
  body.preview{ background:linear-gradient(140deg,#3b6ea5,#7fa8c9) }  /* 浏览器预览时模拟桌面 */
  #pet{ display:block; cursor:grab }
  #ops{ position:fixed; top:4px; right:6px; display:flex; gap:4px; opacity:0; transition:opacity .18s }
  body:hover #ops{ opacity:1 }
  #ops button{ font:inherit; font-size:12px; padding:3px 9px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(120,95,65,.5); background:rgba(24,19,15,.78); color:#cbb89a }
  #ops button:hover{ color:#ffb35c; border-color:#ffb35c }
</style>
</head>
<body>
<canvas id="pet" width="260" height="250"></canvas>
<div id="ops">
  <button id="bPause" title="暂停/继续">‖</button>
  <button id="bMain" title="打开主窗口">⤢</button>
</div>
<script>
(function () {
  const T = window.__TAURI__;
  const inv = T && T.core ? T.core.invoke : null;
  if (!inv) document.body.classList.add('preview');

  const cv = document.getElementById('pet'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 260, H = 250;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // —— 资产（与主舞台同一套精灵图/静态图）——
  const VM = {
    v_idle_breath:{frames:61,x0:74,y0:99,x1:350,y1:365}, v_typing:{frames:61,x0:24,y0:104,x1:379,y1:365},
    v_reading:{frames:61,x0:72,y0:98,x1:349,y1:365}, v_doze:{frames:61,x0:74,y0:98,x1:349,y1:365},
    v_writing:{frames:61,x0:65,y0:93,x1:362,y1:364}, v_tea:{frames:61,x0:92,y0:93,x1:349,y1:365},
    v_stretch:{frames:61,x0:71,y0:67,x1:328,y1:379}, v_onsen:{frames:61,x0:58,y0:60,x1:365,y1:368},
    v_eat:{frames:61,x0:70,y0:96,x1:349,y1:365}, v_pause:{frames:61,x0:86,y0:100,x1:349,y1:365},
    v_urge:{frames:61,x0:51,y0:92,x1:357,y1:369},
  };
  const SM = {
    pose_light2:{x0:109,y0:223,x1:865,y1:880}, pose_blow2:{x0:192,y0:246,x1:851,y1:885},
    pose_wave:{x0:203,y0:218,x1:839,y1:879}, pose_leave:{x0:306,y0:236,x1:754,y1:886},
  };
  const CELL = 420, COLS = 8, FPS = 12;
  const K = 0.5, VS = K, PS = K * 0.41;      // 精灵/静态统一身量（约130px高）
  const SHEETS = {}, SIMGS = {};
  for (const n in VM) { const im = new Image(); im.src = 'assets/capy/' + n + '.webp'; SHEETS[n] = im; }
  for (const n in SM) { const im = new Image(); im.src = 'assets/capy/' + n + '.png'; SIMGS[n] = im; }

  // —— 布局：无地板。左=小圆几+蜡烛，右=水豚，影子把两者"放"在桌面上 ——
  const GY = H - 16;               // 地线（窗口内的落脚线）
  const TABLE_X = 62, TABLE_TOP = GY - 56;
  const ANCHOR = 172, ANCHOR_SUMMON = 132;
  let charX = ANCHOR;

  let view = { status: 'idle', stages: [], idx: 0, end_ms: 0, remaining_ms: 0, activity: '' };
  let phase = 'idle', phaseT = 0, prevStatus = 'idle', restClip = 'v_onsen';
  let cur = '', prev = '', fadeT = 1, clipT = 0, slideX = 0;
  let dozeT = 0, dozing = false;
  const parts = [];
  let t = 0, last = 0;

  const stageKind = (v) => (v.stages[v.idx] || {}).kind || '';
  const restPhaseFor = (v) => (v.stages[v.idx] && v.stages[v.idx].secs <= 420) ? 'restS' : 'restL';
  function enter(p) {
    phase = p; phaseT = 0;
    if (p === 'summon') charX = ANCHOR_SUMMON;
    if (p === 'restS') restClip = Math.random() < 0.5 ? 'v_tea' : 'v_stretch';
    if (p === 'restL') restClip = Math.random() < 0.5 ? 'v_onsen' : 'v_eat';
  }
  function onView(v) {
    const st = v.status;
    if (st !== prevStatus || (st === 'running' && phase !== 'summon')) {
      if ((prevStatus === 'idle' || prevStatus === 'done') && st === 'running') enter('summon');
      else if (st === 'done' && ['work','restS','restL','pause','awaiting','summon'].includes(phase)) enter('wave');
      else if (st === 'idle' && ['work','restS','restL','pause','awaiting'].includes(phase)) enter('blow');
      else if (st === 'running' && !['summon','wave','blow','leave'].includes(phase)) {
        const want = stageKind(v) === 'break' ? restPhaseFor(v) : 'work';
        if ((want === 'work') !== (phase === 'work')) enter(want);
      }
      else if (st === 'paused' && phase !== 'pause' && !['wave','blow','leave'].includes(phase)) enter('pause');
      else if (st === 'awaiting' && phase !== 'awaiting' && !['wave','blow','leave'].includes(phase)) enter('awaiting');
      else if (st === 'idle' && !['blow','leave'].includes(phase)) { phase = 'idle'; cur = prev = ''; }
    }
    prevStatus = st; view = v;
  }

  const pad2 = (n) => String(n).padStart(2, '0');
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); };
  function candleFraction(v) {
    if (!v.stages || !v.stages.length) return 1;
    let total = 0, remain = 0;
    v.stages.forEach((s, i) => {
      if (s.kind !== 'work') return;
      total += s.secs;
      if (i > v.idx) remain += s.secs;
      else if (i === v.idx) {
        const ms = v.status === 'running' ? Math.max(0, v.end_ms - Date.now()) : v.remaining_ms;
        remain += (['running','paused'].includes(v.status)) ? ms / 1000 : (v.status === 'awaiting' ? 0 : s.secs);
      }
    });
    return total > 0 ? remain / total : 1;
  }
  function plateText() {
    if (view.status === 'running') return fmt(Math.max(0, view.end_ms - Date.now()));
    if (view.status === 'paused') return fmt(view.remaining_ms);
    if (view.status === 'awaiting') { const nx = view.stages[view.idx + 1]; return nx ? fmt(nx.secs * 1000) : ''; }
    return '';
  }
  function spawn(p) { if (parts.length < 60) parts.push(p); }

  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    t += dt; phaseT += dt; clipT += dt;
    if (fadeT < 1) fadeT = Math.min(1, fadeT + dt / 0.3);

    if (phase === 'summon' && phaseT > 2.3) enter(stageKind(view) === 'break' ? restPhaseFor(view) : 'work');
    if (phase === 'wave' && phaseT > 1.2) enter('blow');
    if (phase === 'blow' && phaseT > 1.0) enter('leave');
    if (phase === 'leave' && phaseT > 1.4) { phase = view.status === 'done' ? 'done' : 'idle'; cur = prev = ''; }
    if (phase === 'work') {
      dozeT += dt;
      if (!dozing && dozeT > 25) { dozing = true; dozeT = 0; }
      else if (dozing && dozeT > 7) { dozing = false; dozeT = 0; }
    }
    charX += ((phase === 'summon' ? ANCHOR_SUMMON : ANCHOR) - charX) * Math.min(1, dt * 5);

    const act = view.activity || 'idle';
    const setPose = (n) => { if (n !== cur) { prev = cur; cur = n; fadeT = 0; clipT = 0; } };
    if (phase === 'idle' || phase === 'done') { cur = prev = ''; }
    else if (phase === 'summon') setPose('pose_light2');
    else if (phase === 'work') setPose(act === 'idle' ? (dozing ? 'v_doze' : 'v_idle_breath') : ('v_' + act));
    else if (phase === 'restS' || phase === 'restL') setPose(restClip);
    else if (phase === 'pause') setPose('v_pause');
    else if (phase === 'awaiting') setPose('v_urge');
    else if (phase === 'wave') setPose('pose_wave');
    else if (phase === 'blow') setPose('pose_blow2');
    else if (phase === 'leave') setPose('pose_leave');
    slideX = phase === 'summon' ? Math.pow(1 - Math.min(1, phaseT / 0.8), 2) * 130
           : phase === 'leave' ? Math.pow(phaseT / 1.4, 1.5) * 160 : 0;

    ctx.clearRect(0, 0, W, H);

    // —— 小圆几 + 烛钟 ——
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(TABLE_X, GY + 4, 40, 7, 0, 0, Math.PI * 2); ctx.fill();
    // 桌腿
    ctx.strokeStyle = '#4a3826'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (const d of [-14, 0, 14]) {
      ctx.beginPath(); ctx.moveTo(TABLE_X + d, TABLE_TOP + 6); ctx.lineTo(TABLE_X + d * 1.5, GY); ctx.stroke();
    }
    // 桌面
    ctx.fillStyle = '#6b543c';
    ctx.beginPath(); ctx.ellipse(TABLE_X, TABLE_TOP, 36, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7d654a';
    ctx.beginPath(); ctx.ellipse(TABLE_X, TABLE_TOP - 3, 36, 10, 0, 0, Math.PI * 2); ctx.fill();
    // 蜡烛（长度=剩余工作量）
    const frac = candleFraction(view);
    const CMIN = 20, CFULL = 54;
    const candleH = CMIN + (CFULL - CMIN) * frac;
    const cx = TABLE_X, base = TABLE_TOP - 4, top = base - candleH, w = 16;
    const wg = ctx.createLinearGradient(cx - w/2, 0, cx + w/2, 0);
    wg.addColorStop(0, '#e8ddc8'); wg.addColorStop(.5, '#fdf6e3'); wg.addColorStop(1, '#cfc0a4');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(cx - w/2, base); ctx.lineTo(cx - w/2, top + 3);
    ctx.quadraticCurveTo(cx - w/2, top, cx - w/2 + 4, top);
    ctx.lineTo(cx + w/2 - 3, top + 1);
    ctx.quadraticCurveTo(cx + w/2, top + 2, cx + w/2, top + 5);
    ctx.lineTo(cx + w/2, base); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(140,115,80,.4)'; ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const ry = base - CMIN - (CFULL - CMIN) * (i / 4);
      if (ry > top + 4) { ctx.beginPath(); ctx.moveTo(cx - w/2 + 1, ry); ctx.quadraticCurveTo(cx, ry + 1.5, cx + w/2 - 1, ry); ctx.stroke(); }
    }
    ctx.strokeStyle = '#2a2018'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx + 0.5, top - 5); ctx.stroke();
    const fy = top - 5;
    const litPhases = ['summon','work','pause','wave','blow'];
    const flameLit = litPhases.includes(phase) &&
      !(phase === 'summon' && phaseT < 1.32) && !(phase === 'blow' && phaseT > 0.45);
    if (flameLit) {
      const paused = phase === 'pause';
      const sway = paused ? 0 : Math.sin(t*2.4)*1.4 + Math.sin(t*7.1)*0.7;
      const br = paused ? 1 : 1 + Math.sin(t*3.1)*0.06;
      const fh = (paused ? 16 : 22) * br, fw = 11 * (2 - br);
      const glow = ctx.createRadialGradient(cx, fy - fh*0.4, 2, cx, fy - fh*0.4, 70);
      glow.addColorStop(0, 'rgba(255,170,60,' + (paused ? 0.15 : 0.26 + Math.sin(t*3)*0.04) + ')');
      glow.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, fy - fh*0.4, 70, 0, Math.PI*2); ctx.fill();
      for (const [s,c1,c2] of [[1,'#ff7a1f','#ff9f3c'],[0.72,'#ffb43a','#ffd25e'],[0.44,'#ffe9a8','#fff7dd']]) {
        const hh = fh*s, ww = fw*s, tipX = sway*s*s;
        const g = ctx.createLinearGradient(0, fy, 0, fy - hh);
        g.addColorStop(0, c1); g.addColorStop(1, c2);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(cx - ww/2, fy);
        ctx.bezierCurveTo(cx - ww/2 - 1.5, fy - hh*0.42, cx + tipX - ww*0.16, fy - hh*0.75, cx + tipX, fy - hh);
        ctx.bezierCurveTo(cx + tipX + ww*0.16, fy - hh*0.75, cx + ww/2 + 1.5, fy - hh*0.42, cx + ww/2, fy);
        ctx.quadraticCurveTo(cx, fy + 2*s, cx - ww/2, fy);
        ctx.fill();
      }
      if (!paused && Math.random() < 0.12) spawn({ k:'ember', x:cx+(Math.random()-0.5)*4, y:fy-fh*0.8,
        vx:(Math.random()-0.5)*5, vy:-(10+Math.random()*12), life:1, r:0.6+Math.random()*0.8 });
    } else if (phase === 'blow' || (phase === 'leave' && phaseT < 0.6)) {
      if (Math.random() < 0.5) spawn({ k:'smoke', x:cx, y:fy, vx:(Math.random()-0.5)*6+4, vy:-(9+Math.random()*8), life:1, r:1.2+Math.random()*1.5 });
    } else if (phase === 'idle' && Math.random() < 0.01) {
      spawn({ k:'smoke', x:cx, y:fy, vx:(Math.random()-0.5)*3, vy:-6, life:0.6, r:0.9 });
    }

    // —— 水豚（影子先画）——
    if (cur) {
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.beginPath(); ctx.ellipse(charX + slideX, GY + 4, 62, 9, 0, 0, Math.PI * 2); ctx.fill();
    }
    const drawChar = (name, alpha) => {
      ctx.save(); ctx.globalAlpha = alpha;
      if (VM[name]) {
        const m = VM[name], sheet = SHEETS[name];
        if (sheet.complete && sheet.naturalWidth) {
          const total = m.frames;
          const fi0 = Math.floor(clipT * FPS) % (total * 2 - 2);
          const fi = fi0 < total ? fi0 : total * 2 - 2 - fi0;
          const sx = (fi % COLS) * CELL, sy = Math.floor(fi / COLS) * CELL;
          ctx.drawImage(sheet, sx, sy, CELL, CELL,
            charX + slideX - ((m.x0 + m.x1) / 2) * VS, GY - m.y1 * VS, CELL * VS, CELL * VS);
        }
      } else if (SM[name]) {
        const m = SM[name], im = SIMGS[name];
        if (im.complete && im.naturalWidth) {
          const bw = (m.x1 - m.x0) * PS, bh = (m.y1 - m.y0) * PS;
          ctx.translate(charX + slideX, GY);
          ctx.scale(1, 1 + Math.sin(t * 1.2) * 0.011);
          ctx.drawImage(im, m.x0, m.y0, m.x1 - m.x0, m.y1 - m.y0, -bw / 2, -bh, bw, bh);
        }
      }
      ctx.restore();
    };
    if (cur) {
      if (fadeT < 1 && prev) drawChar(prev, 1 - fadeT);
      drawChar(cur, fadeT < 1 ? fadeT : 1);
      if (phase === 'summon' && phaseT >= 1.05 && phaseT < 1.32) {  // 火种跳跃
        const tipX = charX + slideX - 367 * PS, tipY = GY - 523 * PS;
        const p = (phaseT - 1.05) / 0.27;
        const sx2 = tipX + (cx - tipX) * p, sy2 = tipY + (fy - tipY) * p - Math.sin(p * Math.PI) * 7;
        ctx.fillStyle = 'rgba(255,210,110,.95)';
        ctx.beginPath(); ctx.arc(sx2, sy2, 2.4 + Math.sin(t * 22) * 0.7, 0, Math.PI * 2); ctx.fill();
      }
    }

    // —— 迷你木牌（挂在小几前沿）——
    const txt = plateText();
    if (txt) {
      const pw = 50, ph = 18, px = TABLE_X, py = GY - 8;
      ctx.fillStyle = 'rgba(40,30,20,.85)';
      ctx.beginPath(); ctx.roundRect(px - pw/2, py - ph/2, pw, ph, 5); ctx.fill();
      const alertNow = view.status === 'running' && (view.end_ms - Date.now()) <= 10_000;
      ctx.fillStyle = alertNow ? '#ffb35c' : (phase === 'pause' ? 'rgba(232,214,180,.55)' : '#e8d6b4');
      ctx.font = '600 12px Georgia,"PingFang SC",serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, px, py + 0.5);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }

    // 粒子
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt * (p.k === 'smoke' ? 0.55 : 0.9);
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.k === 'ember') {
        ctx.fillStyle = 'rgba(255,' + Math.floor(120 + p.life * 100) + ',60,' + p.life * 0.9 + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(200,195,185,' + p.life * 0.3 + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (2 - p.life), 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  requestAnimationFrame(frame);

  // —— 交互 ——
  document.getElementById('bMain').onclick = () => { if (inv) inv('open_main'); };
  document.getElementById('bPause').onclick = async () => {
    if (!inv) return;
    try {
      const cmd = view.status === 'paused' ? 'resume' : (view.status === 'awaiting' ? 'start_next' : 'pause');
      view = await inv('session_cmd', { cmd });
    } catch (e) {}
  };
  // 拖动：按住画布拖走（记住位置）
  cv.addEventListener('mousedown', async (e) => {
    if (e.button !== 0 || !T) return;
    try { await T.window.getCurrentWindow().startDragging(); } catch (err) {}
  });
  if (T) {
    const win = T.window.getCurrentWindow();
    win.onMoved((p) => { try { localStorage.setItem('tm_pet_pos', JSON.stringify(p.payload)); } catch (e) {} });
    try {
      const saved = JSON.parse(localStorage.getItem('tm_pet_pos') || 'null');
      if (saved) win.setPosition(new T.window.PhysicalPosition(saved.x, saved.y));
    } catch (e) {}
  }

  // —— 数据 ——
  if (inv) {
    (async () => { try { onView(await inv('get_state')); } catch (e) {} })();
    T.event.listen('state', (e) => onView(e.payload));
  } else {
    // 浏览器预览：模拟一个进行中的工作段（会先演点烛仪式）
    onView({ status: 'running', stages: [{kind:'work',secs:1500},{kind:'break',secs:300}], idx: 0,
      end_ms: Date.now() + 24*60*1000 + 57000, remaining_ms: 0, activity: 'idle' });
  }
})();
</script>
</body>
</html>
