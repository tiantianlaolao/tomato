<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>强制休息</title>
<style>
  *{ box-sizing:border-box; -webkit-user-select:none; user-select:none; cursor:default }
  html,body{ height:100% }
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#12100d; color:#e8dcc8; overflow:hidden;
  }
  .wrap{ text-align:center }
  #scene{ display:block; margin:0 auto }
  .word{ font-size:1.3rem; font-weight:700; color:#0CA678; margin-top:6px }
  .count{ font-size:clamp(56px,9vw,110px); font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:.02em; color:#e8d6b4; margin-top:2px }
  .count.dimmed{ opacity:.5; animation:breath 2s ease-in-out infinite }
  @keyframes breath{ 50%{ opacity:.3 } }
  .tip{ color:#7a6b55; margin-top:4px; font-size:.92rem }
  button{
    font:inherit; cursor:pointer; margin-top:20px; padding:10px 32px; font-size:1rem;
    border:1px solid #3d4a3d; border-radius:12px; background:transparent; color:#a9cbbc;
  }
  button:hover{ border-color:#0CA678; color:#0CA678 }
  #urgent{
    margin-top:28px; font-size:.8rem; color:#4d4336; cursor:pointer; user-select:none;
    padding:6px 14px; border:1px dashed #3a3229; border-radius:8px; display:inline-block;
  }
  #urgent:hover{ color:#7a6b55; border-color:#5a4d3c }
  #urgent.holding{ color:#c98a4a; border-color:#c98a4a }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="scene" width="360" height="330"></canvas>
  <div class="word">陪它泡一会儿</div>
  <div id="count" class="count">--:--</div>
  <div class="tip">强制休息中，休息结束会自动放行</div>
  <button id="btnPause">‖ 暂停</button>
  <div id="urgent" title="真有急事再用：会结束整个会话">有急事？按住 5 秒结束本次会话</div>
</div>
<script>
(function () {
  const inv = window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__.core.invoke : null;
  let view = { status: 'idle' };
  const pad2 = (n) => String(n).padStart(2, '0');
  const el = document.getElementById('count');
  const btn = document.getElementById('btnPause');

  // —— 温泉场景：精灵图往返循环 + 程序热气 ——
  const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
  const CELL = 420, COLS = 8, FPS = 12, FRAMES = 61;
  const M = { x0: 58, y0: 60, x1: 365, y1: 368 };
  const sheet = new Image(); sheet.src = 'assets/capy/v_onsen.webp';
  const parts = [];
  let t = 0, last = 0, clipT = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    t += dt; clipT += dt;
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (sheet.complete && sheet.naturalWidth) {
      const paused = view.status === 'paused';
      if (!paused) { /* 暂停时画面也静一拍 */ }
      const fi0 = Math.floor(clipT * FPS) % (FRAMES * 2 - 2);
      const fi = paused ? 0 : (fi0 < FRAMES ? fi0 : FRAMES * 2 - 2 - fi0);
      const sx = (fi % COLS) * CELL, sy = Math.floor(fi / COLS) * CELL;
      const S = 0.95;
      const dx = cv.width / 2 - ((M.x0 + M.x1) / 2) * S;
      const dy = cv.height - 10 - M.y1 * S;
      ctx.drawImage(sheet, sx, sy, CELL, CELL, dx, dy, CELL * S, CELL * S);
    }
    // 热气
    if (Math.random() < 0.25) parts.push({ x: cv.width/2 + (Math.random()-0.5)*160, y: cv.height - 60,
      vx: (Math.random()-0.5)*6, vy: -(14+Math.random()*12), life: 1, r: 3+Math.random()*4 });
    for (let i = parts.length-1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*0.35;
      if (p.life <= 0) { parts.splice(i,1); continue; }
      ctx.fillStyle = 'rgba(220,230,225,' + p.life*0.12 + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(2-p.life), 0, Math.PI*2); ctx.fill();
    }
  }
  requestAnimationFrame(frame);

  function paint() {
    if (view.status === 'running') {
      const remain = Math.max(0, view.end_ms - Date.now());
      const s = Math.ceil(remain / 1000);
      el.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
      el.classList.remove('dimmed');
      btn.textContent = '‖ 暂停';
    } else if (view.status === 'paused') {
      const s = Math.ceil(view.remain_ms / 1000);
      el.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
      el.classList.add('dimmed');
      btn.textContent = '▶ 继续';
    }
  }
  if (!inv) { paint(); return; }  // 纯浏览器打开=只看静态场景
  async function refresh() { try { view = await inv('get_state'); paint(); } catch (e) {} }
  btn.onclick = async () => {
    try { view = await inv('session_cmd', { cmd: view.status === 'paused' ? 'resume' : 'pause' }); paint(); } catch (e) {}
  };
  window.__TAURI__.event.listen('state', (e) => { view = e.payload; paint(); });
  setInterval(paint, 250);
  refresh();
  window.addEventListener('blur', () => { try { inv('rest_focus'); } catch (e) {} });

  // 紧急出口：按住 5 秒结束整个会话（走内核本就未锁的 stop 通道；长按门槛保证不是手滑）。
  // 没有这个的话，遮罩期间主窗够不到、托盘被盖住，真有急事只能杀进程。
  const urgent = document.getElementById('urgent');
  const URGENT_TXT = urgent.textContent;
  let holdTimer = 0, holdLeft = 0;
  const holdStop = () => {
    clearInterval(holdTimer); holdTimer = 0;
    urgent.classList.remove('holding');
    urgent.textContent = URGENT_TXT;
  };
  urgent.addEventListener('mousedown', () => {
    holdLeft = 5;
    urgent.classList.add('holding');
    urgent.textContent = '继续按住 ' + holdLeft + ' 秒…';
    holdTimer = setInterval(async () => {
      holdLeft -= 1;
      if (holdLeft > 0) { urgent.textContent = '继续按住 ' + holdLeft + ' 秒…'; return; }
      holdStop();
      try { await inv('session_cmd', { cmd: 'stop' }); } catch (e) {}
    }, 1000);
  });
  ['mouseup', 'mouseleave'].forEach((ev) => urgent.addEventListener(ev, holdStop));
})();
</script>
</body>
</html>
