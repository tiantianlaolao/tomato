<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14100d">
<title>capyroom</title>
<!--
  外壳：只有骨架，画面在 scene.js、流程在 main.js。
  🔴 本版全部是占位色块，不含任何美术资产 —— 先把架构跑通。资产可以换，架构不行。
  浏览器验收：?demo=idle | running | pre | break | paused | awaiting | done | grace
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <!-- 空闲：选一个预设就开始（§12 第 5 条：第一版只给预设，不做序列编辑器） -->
  <div id="picker">
    <div class="hint">选一支，它就下水陪你</div>
    <div id="planlist"></div>
  </div>

  <!-- 运行中：零 UI。轻触画面才临时唤出，3 秒收起 -->
  <div id="ops" class="hide">
    <button id="opPause">暂停</button>
    <button id="opSkip">跳过这段</button>
  </div>

  <!-- 段间等待 -->
  <div id="nextbar" class="hide">
    <button id="nextbtn">开始下一段</button>
  </div>

  <!-- 完成卡片 -->
  <div id="donecard" class="hide">
    <div class="dc-title">这一场结束了</div>
    <div id="doneMain">—</div>
    <div id="doneSub">—</div>
    <button id="doneOk">好</button>
  </div>

  <!-- 长按结束：规则常驻（§3.3 不提前说，代价就没有威慑力） -->
  <div id="holdbar" class="hide">
    <div id="holdring"></div>
    <span id="holdtip">长按结束</span>
  </div>
</div>

<script src="scene.js"></script>
<script src="main.js"></script>
</body>
</html>
