<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14100d">
<title>capyroom</title>
<!--
  外壳：只有骨架，画面在 scene.js、流程在 main.js。
  🔴 本版全部是占位色块，不含任何美术资产 —— 先把架构跑通。资产可以换，架构不行。
  浏览器验收：?demo=idle | running | pre | break | paused | awaiting | done | grace
-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <!-- 🔴 诊断条：内测专用，上架前连同 Rust 的 diag / test_notify 一起删。
       点左边文字＝刷新，点「试响」＝A/B/C 三连排期（6/9/12 秒后依次响），
       一轮 12 秒就能判定"通知到底卡在哪"，不用真等一个番茄段。 -->
  <div id="diag">
    <span id="diagTxt">诊断…</span>
    <button id="diagRing">试响</button>
  </div>

  <!-- 空闲：画面里没有悬浮按钮（§9 功能入口伪装成场景里的物件）。
       点岸边的木牌＝开始/编排，石灯笼＝设置，石头＝记录。
       ⚠️ 可发现性靠这行提示兜底：不写的话，新用户看着一张画不知道能点。 -->
  <div id="picker">
    <div class="hint">点岸边的木牌开始 · 石灯笼是设置 · 石头是记录</div>
  </div>

  <!-- 面板：编排 / 记录 / 设置 共用一个底部抽屉 -->
  <div id="sheet" class="hide">
    <div id="sheetHead">
      <span id="sheetTitle">编排</span>
      <button id="sheetClose">收起</button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <!-- 运行中：零 UI。轻触画面才临时唤出，3 秒收起 -->
  <div id="ops" class="hide">
    <button id="opPause">暂停</button>
    <button id="opSkip">跳过这段</button>
  </div>

  <!-- 段间等待 -->
  <div id="nextbar" class="hide">
    <button id="nextbtn">开始下一段</button>
  </div>

  <!-- 完成卡片 -->
  <div id="donecard" class="hide">
    <div class="dc-title">这一场结束了</div>
    <div id="doneMain">—</div>
    <div id="doneSub">—</div>
    <button id="doneOk">好</button>
  </div>

  <!-- 长按结束：规则常驻（§3.3 不提前说，代价就没有威慑力） -->
  <div id="holdbar" class="hide">
    <div id="holdring"></div>
    <span id="holdtip">长按结束</span>
  </div>
</div>

<!-- 引擎 → 场景包 → 外壳。加第二个场景就在这儿多挂一份 scene_xxx.js -->
<script src="capy.js"></script>
<script src="scene.js"></script>
<script src="scene_onsen.js"></script>
<script src="main.js"></script>
</body>
</html>
