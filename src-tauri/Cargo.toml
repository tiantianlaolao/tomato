[package]
name = "tomato"
version = "0.1.0"
description = "番茄时钟 · 自由编排工作/休息序列的专注计时器"
edition = "2021"

[lib]
name = "tomato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：桌宠窗的 transparent:true 在 macOS 上必须靠它才生效，
# 否则 WKWebView 回落成不透明白底 —— 桌面上就是一块白方块（Windows 不需要这个开关）。
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
